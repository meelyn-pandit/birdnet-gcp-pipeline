[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "birdnet-gcp-pipeline"
version = "0.2.0"
description = "Acoustic monitoring pipeline: recordings metadata, labeling, BirdNET/Perch detectors and evaluation, on Google Cloud"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<2.1",
    "scipy>=1.10",
    "soundfile>=0.12",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
# Pretrained models: BirdNET (detections + embeddings) and Perch v2.
# perch-hoplite 1.0 renamed classes that birdnet-analyzer 2.4.0 still uses.
ml = [
    "birdnet-analyzer[embeddings]==2.4.0",
    "perch-hoplite>=0.1.3,<1.0",
]
dev = ["pytest>=8"]

[project.scripts]
bgp-build-metadata = "birdnet_pipeline.cli.build_metadata:main"
bgp-estimate-upload = "birdnet_pipeline.cli.estimate_upload:main"
bgp-convert-flac = "birdnet_pipeline.cli.convert_to_flac:main"
bgp-pick-sample = "birdnet_pipeline.cli.pick_sample:main"
bgp-audacity-labels = "birdnet_pipeline.cli.audacity_labels:main"
bgp-review-sheet = "birdnet_pipeline.cli.review_sheet:main"
bgp-load-labels = "birdnet_pipeline.cli.load_labels:main"
bgp-evaluate = "birdnet_pipeline.cli.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
