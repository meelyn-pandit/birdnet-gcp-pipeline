name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (core + dev; the large ML models are not needed for tests)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libsndfile1
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
